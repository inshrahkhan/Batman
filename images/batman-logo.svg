<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="batGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb703;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c98b1f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main bat symbol -->
  <g fill="url(#batGradient)" stroke="none">
    <!-- Left wing -->
    <path d="M 100 40 L 60 50 Q 30 60 25 90 Q 20 110 35 125 Q 45 135 55 130 L 70 75 Z"/>
    
    <!-- Right wing -->
    <path d="M 100 40 L 140 50 Q 170 60 175 90 Q 180 110 165 125 Q 155 135 145 130 L 130 75 Z"/>
    
    <!-- Center body -->
    <ellipse cx="100" cy="110" rx="15" ry="35" fill="url(#batGradient)"/>
    
    <!-- Head -->
    <circle cx="100" cy="55" r="20" fill="url(#batGradient)"/>
    
    <!-- Left ear -->
    <path d="M 85 35 Q 75 20 75 15 Q 75 10 80 10 Q 90 15 88 35 Z"/>
    
    <!-- Right ear -->
    <path d="M 115 35 Q 125 20 125 15 Q 125 10 120 10 Q 110 15 112 35 Z"/>
    
    <!-- Chest emblem detail -->
    <rect x="95" y="100" width="10" height="15" fill="#030303" opacity="0.3"/>
  </g>
  
  <!-- Accent outline -->
  <g stroke="#c98b1f" stroke-width="1.5" fill="none">
    <circle cx="100" cy="55" r="20"/>
    <path d="M 85 35 Q 75 20 75 15 Q 75 10 80 10 Q 90 15 88 35 Z"/>
    <path d="M 115 35 Q 125 20 125 15 Q 125 10 120 10 Q 110 15 112 35 Z"/>
  </g>
</svg>
